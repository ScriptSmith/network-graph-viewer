[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-graph-viewer"
version = "0.3.0"
description = "Interactive network graphs in a Jupyter notebook"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Smith" }]
keywords = ["network", "graph", "jupyter", "widget", "anywidget", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = ["anywidget>=0.9"]

[project.urls]
Homepage = "https://adamsm.com/network-graph-viewer/"
Repository = "https://github.com/ScriptSmith/network-graph-viewer"
Issues = "https://github.com/ScriptSmith/network-graph-viewer/issues"

[project.optional-dependencies]
# Neither is imported at module level. Both are common enough in a notebook
# that the extra is mostly a convenience for a fresh environment.
pandas = ["pandas>=2.0"]
networkx = ["networkx>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.0", "networkx>=3.0", "nbmake>=1.5", "ipykernel>=6", "ruff>=0.6"]

# The widget bundle is generated by `pnpm build:widget` and git-ignored, and
# hatchling leaves VCS-ignored files out of a build by default. Naming it as an
# artifact is what guarantees it is packaged: without this the wheel would
# still install, and the widget would fail to load at the far end.
[tool.hatch.build]
artifacts = ["src/network_graph_viewer/static/widget.js"]

[tool.hatch.build.targets.wheel]
packages = ["src/network_graph_viewer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Stated rather than left to the default, so a config sitting in some parent
# directory cannot make this lint differently here than it does in CI.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
